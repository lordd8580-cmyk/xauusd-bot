name: Build XAU/USD Bot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y \
            zip unzip git \
            libffi-dev libssl-dev \
            build-essential zlib1g-dev \
            autoconf libtool pkg-config \
            cmake ccache \
            gettext autopoint

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export ANDROIDSDK=$ANDROID_SDK_ROOT
          yes | buildozer -v android debug 2>&1 | tee build.log
          ls -la bin/ 2>/dev/null || echo "bin/ yoxdur"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-bot-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
